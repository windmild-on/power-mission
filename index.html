<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요일별 운동 미션</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="파워 미션">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --primary: #ff5722;
      --accent: #2196f3;
      --success: #4caf50;
      --text: #ffffff;
      --sub: #aaaaaa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      color: var(--primary);
    }
    .day-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 4px 12px;
      background: #333;
      border-radius: 20px;
      font-size: 14px;
      color: #fff;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .set-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    .btn-set {
      flex: 1;
      padding: 10px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: var(--sub);
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-set.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .ex-item {
      border-bottom: 1px solid #333;
      padding: 12px 0;
    }
    .ex-item:last-child {
      border-bottom: none;
    }
    .ex-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .ex-detail {
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 8px;
    }
    .set-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-chk {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid #555;
      background: #2a2a2a;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-chk.done {
      background: var(--success);
      border-color: var(--success);
      font-weight: bold;
    }
    .progress-wrap {
      margin-top: 4px;
      font-size: 13px;
      color: var(--sub);
      text-align: center;
    }
    .btn-complete {
      width: 100%;
      padding: 14px;
      border: none;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }
    .btn-complete:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>

<div class="app">
  <header>
    <h1>🔥 요일별 파워 미션</h1>
    <div id="dayBadge" class="day-badge">오늘의 요일 계산 중...</div>
  </header>

  <!-- 세트 옵션 선택 -->
  <div class="card">
    <div style="font-size: 14px; margin-bottom: 8px; color: var(--sub);">목표 세트 선택</div>
    <div class="set-selector">
      <button class="btn-set active" id="btn3Set" onclick="setMode(3)">3 Set 모드</button>
      <button class="btn-set" id="btn5Set" onclick="setMode(5)">5 Set 모드</button>
    </div>
  </div>

  <!-- 운동 목록 -->
  <div class="card">
    <h2 id="partTitle" style="font-size:18px; margin-top:0; color:var(--primary);">오늘의 목표 미션</h2>
    <div id="exerciseList"></div>
    <div class="progress-wrap" id="progressText"></div>
  </div>

  <button class="btn-complete" onclick="finishToday()">오늘의 미션 완료하기!</button>
</div>

<script>
  // 요일별 미션 데이터 (월~금: 부위별 분할, 토/일: 리커버리·휴식)
  const workoutSchedule = {
    1: { name: "월요일: 가슴 & 삼두 파괴", exercises: [
      { title: "1. Push-up (푸시업)", detail: "가슴 / 15회" },
      { title: "2. Bench Dips (벤치 딥스)", detail: "팔 뒷근육(삼두) / 12회" }
    ]},
    2: { name: "화요일: 하체 & 코어 밸런스", exercises: [
      { title: "1. Squat (스쿼트)", detail: "허벅지 / 20회" },
      { title: "2. Lunge (런지)", detail: "하체 전체 / 양쪽 각 10회" },
      { title: "3. Plank (플랭크)", detail: "복근 & 코어 / 45초 버티기" }
    ]},
    3: { name: "수요일: 등 & 이두 강화", exercises: [
      { title: "1. Superman Hold (슈퍼맨 홀드)", detail: "등 & 허리 / 15회" },
      { title: "2. Arm Curl (암 컬)", detail: "팔 앞근육(이두) / 15회" }
    ]},
    4: { name: "목요일: 어깨 & 코어 불태우기", exercises: [
      { title: "1. Pike Push-up (파이크 푸시업)", detail: "어깨 / 10회" },
      { title: "2. Mountain Climber (마운틴 클라이머)", detail: "복근 & 유산소 / 20회" }
    ]},
    5: { name: "금요일: 전신 & 유산소", exercises: [
      { title: "1. Burpee Test (버피 테스트)", detail: "전신 체력 / 10회" },
      { title: "2. Jump Rope (제자리 줄넘기)", detail: "유산소 / 100회" }
    ]},
    6: { name: "토요일: 자율 스트레칭 & 휴식", exercises: [
      { title: "1. 전신 스트레칭", detail: "근육 이완 / 10분" },
      { title: "2. 휴식 및 컨디션 관리", detail: "다음 주를 위한 충분한 수면과 영양 섭취" }
    ]},
    0: { name: "일요일: 자율 스트레칭 & 휴식", exercises: [
      { title: "1. 가벼운 스트레칭", detail: "근육 이완 / 10분" },
      { title: "2. 완전 휴식", detail: "다음 주를 위한 충분한 수면과 충전" }
    ]}
  };

  let targetSet = 3;
  const today = new Date().getDay(); // 0:일, 1:월, ... 6:토

  function initApp() {
    const todayData = workoutSchedule[today];
    document.getElementById('dayBadge').innerText = todayData.name;
    renderExercises();
  }

  function setMode(sets) {
    targetSet = sets;
    document.getElementById('btn3Set').classList.toggle('active', sets === 3);
    document.getElementById('btn5Set').classList.toggle('active', sets === 5);
    renderExercises();
  }

  function renderExercises() {
    const listEl = document.getElementById('exerciseList');
    const exercises = workoutSchedule[today].exercises;

    listEl.innerHTML = exercises.map((ex) => {
      let setBtns = '';
      for (let s = 1; s <= targetSet; s++) {
        setBtns += `<button class="btn-chk" onclick="toggleSet(this)">${s}S</button>`;
      }
      return `
        <div class="ex-item">
          <div class="ex-title">${ex.title}</div>
          <div class="ex-detail">${ex.detail}</div>
          <div class="set-btns">${setBtns}</div>
        </div>
      `;
    }).join('');

    updateProgress();
  }

  function toggleSet(btn) {
    btn.classList.toggle('done');
    updateProgress();
  }

  function updateProgress() {
    const total = document.querySelectorAll('.btn-chk').length;
    const done = document.querySelectorAll('.btn-chk.done').length;
    document.getElementById('progressText').innerText =
      total > 0 ? `완료한 세트: ${done} / ${total}` : '';
  }

  function finishToday() {
    const total = document.querySelectorAll('.btn-chk').length;
    const done = document.querySelectorAll('.btn-chk.done').length;
    if (done === 0) {
      alert("아직 체크한 세트가 없어요! 운동을 시작해 볼까요? 💪");
      return;
    }
    if (done < total) {
      alert(`오늘 ${done} / ${total} 세트 완료! 조금만 더 힘내볼까? 🔥`);
      return;
    }
    alert("축하합니다! 오늘의 미션을 모두 완료했습니다! 🎉");
  }

  initApp();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
